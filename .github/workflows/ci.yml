name: CI/CD Pyrenex Prod

on:
  workflow_dispatch:
  push:
    branches: [main, joelle]
    tags: ["v*"]
  pull_request:
    branches: [main, joelle]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model deps
        run: pip install -r services/model/requirements.txt pytest httpx
      - name: Tests unitaires + contract test du modèle
        run: pytest -v services/model/tests

  evaluation-tests:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation deps
        run: pip install -r services/model/requirements.txt pytest mlflow pandas scikit-learn
      - name: Tests d'évaluation du modèle (golden run + seuils)
        run: pytest -v tests/test_evaluation.py

  evaluate-model:
     needs: evaluation-tests
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-python@v5
         with:
           python-version: "3.11"
       - name: Install eval deps
         run: pip install -r services/model/requirements.txt mlflow pandas scikit-learn
       - name: Évaluer le modèle vs seuils (golden run)
         run: python scripts/evaluate_model.py --release-tag ${{ github.ref_name }}
      - name: Ensure MLflow tracking directory exists
        if: always()
        run: |
          mkdir -p mlruns
          ls -la
          ls -la mlruns || true
      - name: Upload mlruns (artefact de traçabilité)
         if: always()
         uses: actions/upload-artifact@v4
         with:
           name: mlruns-${{ github.run_id }}
           path: mlruns/

  build:
     needs: evaluate-model
     if: github.event_name == 'push'
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-python@v5
         with:
           python-version: "3.11"
       - name: Build the model
         run: python scripts/evaluate_model.py --release-tag ${{ github.ref }}

  build-and-push:
    needs: evaluate-model
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        run: |
          REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LC}/model" >> $GITHUB_ENV

      - name: Build model image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            ./services/model

      - name: Push model image
        run: |
          docker push --all-tags "${IMAGE_NAME}"
