<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyrenex Crédit — Scoring risque</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .4rem 0 .1rem; font-size: .9rem; }
    input, select { width: 100%; padding: .4rem; box-sizing: border-box; }
    button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
    .ok { background: #e6f4ea; } .ko { background: #fce8e6; }
  </style>
</head>
<body>
  <h1>Pyrenex Crédit — Évaluation du risque de défaut</h1>

  <!-- TODO 1 — construire le formulaire avec les 14 champs de LoanApplication
       (cf. services/*/app/schemas.py) : loan_amnt, int_rate, installment,
       annual_inc, dti, delinq_2yrs, fico_range_low, revol_util (numériques)
       + term, grade, home_ownership, verification_status, purpose, emp_length. -->


  <form id="scoreForm">
       <label for="loan_amnt">Montant du prêt</label>
<input type="number" id="loan_amnt" name="loan_amnt" value="12000" required>

<label for="int_rate">Taux d'intérêt (%)</label>
<input type="number" step="0.01" id="int_rate" name="int_rate" value="11.5" required>

<label for="installment">Mensualité</label>
<input type="number" step="0.01" id="installment" name="installment" value="390.5" required>

<label for="annual_inc">Revenu annuel</label>
<input type="number" step="0.01" id="annual_inc" name="annual_inc" value="55000" required>

<label for="dti">DTI (Debt To Income)</label>
<input type="number" step="0.01" id="dti" name="dti" value="18.5" required>

<label for="delinq_2yrs">Délinquances sur 2 ans</label>
<input type="number" id="delinq_2yrs" name="delinq_2yrs" value="0" required>

<label for="fico_range_low">FICO Score</label>
<input type="number" id="fico_range_low" name="fico_range_low" value="700" required>

<label for="revol_util">Utilisation du crédit (%)</label>
<input type="number" step="0.01" id="revol_util" name="revol_util" value="45.2" required>

<label for="term">Durée</label>
<select id="term" name="term" required>
  <option value="36 months">36 months</option>
  <option value="60 months">60 months</option>
</select>

<label for="grade">Grade</label>
<select id="grade" name="grade" required>
  <option value="A">A</option>
  <option value="B">B</option>
  <option value="C">C</option>
  <option value="D">D</option>
  <option value="E">E</option>
  <option value="F">F</option>
  <option value="G">G</option>
</select>

<label for="home_ownership">Type de logement</label>
<select id="home_ownership" name="home_ownership" required>
  <option value="RENT">RENT</option>
  <option value="OWN">OWN</option>
  <option value="MORTGAGE">MORTGAGE</option>
  <option value="OTHER">OTHER</option>
</select>

<label for="verification_status">Statut de vérification</label>
<select id="verification_status" name="verification_status" required>
  <option value="Verified">Verified</option>
  <option value="Source Verified">Source Verified</option>
  <option value="Not Verified">Not Verified</option>
</select>

<label for="purpose">Objet du prêt</label>
<select id="purpose" name="purpose" required>
  <option value="debt_consolidation">debt_consolidation</option>
  <option value="credit_card">credit_card</option>
  <option value="home_improvement">home_improvement</option>
  <option value="major_purchase">major_purchase</option>
  <option value="small_business">small_business</option>
  <option value="car">car</option>
  <option value="vacation">vacation</option>
  <option value="other">other</option>
</select>

<label for="emp_length">Ancienneté professionnelle</label>
<select id="emp_length" name="emp_length" required>
  <option value="< 1 year">&lt; 1 year</option>
  <option value="1 year">1 year</option>
  <option value="2 years">2 years</option>
  <option value="3 years">3 years</option>
  <option value="4 years">4 years</option>
  <option value="5 years">5 years</option>
  <option value="6 years">6 years</option>
  <option value="7 years">7 years</option>
  <option value="8 years">8 years</option>
  <option value="9 years">9 years</option>
  <option value="10+ years">10+ years</option>
</select>
    <button type="submit">Évaluer le risque</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('scoreForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      // TODO 2 — construire le payload JSON depuis le formulaire
      //   (penser à convertir les champs numériques en Number).
      const formData = new FormData(form);
      const payload = {
        loan_amnt: Number(formData.get('loan_amnt')),
        int_rate: Number(formData.get('int_rate')),
        installment: Number(formData.get('installment')),
        annual_inc: Number(formData.get('annual_inc')),
        dti: Number(formData.get('dti')),
        delinq_2yrs: Number(formData.get('delinq_2yrs')),
        fico_range_low: Number(formData.get('fico_range_low')),
        revol_util: Number(formData.get('revol_util')),
        term: formData.get('term'),
        grade: formData.get('grade'),
        home_ownership: formData.get('home_ownership'),
        verification_status: formData.get('verification_status'),
        purpose: formData.get('purpose'),
        emp_length: formData.get('emp_length')
      };
      // TODO 3 — POST vers /api/score (même origine grâce au proxy nginx),
      //   afficher prediction + probability, gérer les erreurs.
      try {
        const response = await fetch('/api/score', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          // FastAPI/HTTPException renvoie { detail: "..." }
          throw new Error(data.detail || `HTTP error! status: ${response.status}`);
        }
        const label = data.prediction === 1 ? 'Charged Off (risque)' : 'Fully Paid (sûr)';
        result.textContent = `Prédiction: ${label} — Probabilité de défaut: ${(data.probability * 100).toFixed(1)}% (modèle ${data.model_version})`;
        result.className = data.prediction === 1 ? 'ko' : 'ok';
        result.style.display = 'block';
      } catch (error) {
        result.textContent = `Erreur: ${error.message}`;
        result.className = 'ko';
        result.style.display = 'block';
      }
    });
  </script>
</body>
</html>
